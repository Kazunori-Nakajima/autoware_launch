/**:
  ros__parameters:
    # NOTE: Workaround for rclcpp crash when parsing empty lists (https://github.com/ros2/rclcpp/issues/1955)
    filter_names:
      [
        "safety::UncrossableBoundaryDepartureFilter",
        "safety::CollisionCheckFilter",
        "safety::VehicleConstraintFilter",
        "traffic_rule::TrafficLightFilter",
      ]
    # available filters:
    #  "safety::OutOfLaneFilter"
    #  "safety::CollisionFilter"
    #  "safety::CollisionCheckFilter"
    #  "safety::UncrossableBoundaryDepartureFilter"
    #  "safety::VehicleConstraintFilter"

    out_of_lane:
      time: 2.0
      min_value: 0.0

    collision:
      time: 3.0
      min_value: 2.0

    collision_check:
      global_setting:
        time_resolution: 0.1
      drac:
        enable_assessment: false
        predicted_path_trajectory: true
        constant_curvature_trajectory: true
        diffusion_based_trajectory: true
      pet_collision:
        enable_assessment: true
        predicted_path_trajectory: true
        constant_curvature_trajectory: true
        diffusion_based_trajectory: true
        ego_braking_delay: 0.4
        ego_assumed_acceleration: -4.0
        collision_time_threshold: 1.0
      rss:
        enable_assessment: true
        ego_deceleration_threshold: 4.0
        ego_reaction_time: 0.4
        stop_margin: 2.0
        object_acceleration: -4.0


    vehicle_constraint:
      max_speed: 16.7 # m/s
      max_acceleration: 5.0 # m/s^2
      max_deceleration: 5.0 # m/s^2 (positive but represents deceleration)
      max_steering_angle: 0.8 # rad
      max_steering_rate: 100.0 # rad/s (NOTE: dummy value, not used in the current implementation)

    traffic_light:
      deceleration_limit: 2.8  # [m/s^2] trajectories crossing an amber light are rejected if ego can stop at the stop line without breaking this limit
      jerk_limit: 5.0  # [m/s^3] trajectories crossing an amber light are rejected if ego can stop at the stop line without breaking this limit
      delay_response_time: 0.5 # [s] delay response time used to estimate the minimum ego stopping distance
      crossing_time_limit: 2.75 # [s] trajectories crossing an amber light are rejected if they cannot cross before this time
      treat_amber_light_as_red_light: false # [-] when true, amber lights are handled like red lights
      stop_overshoot_margin: 0.5 # [m] maximum distance between the stop line and the trajectory stop point to consider the trajectory feasible
      checked_trajectory_length:  # maximum length of the planned trajectory that is scanned for traffic light stop lines.
        deceleration_limit: 1.0  # [m/s^2] deceleration limit to calculate the stop distance used as trajectory length limit
        jerk_limit: 2.0  # [m/s^3] jerk limit to calculate the stop distance used as trajectory length limit

    boundary_departure:
      lateral_gap_to_boundary_m: 0.01
      longitudinal_gap_to_boundary_m: 1.0
      max_deceleration_mps2: -4.0
      max_jerk_mps3: -5.0
      brake_delay_s: 1.0
      cutoff_time_s: 2.0
      on_time_buffer_s: 0.20
      off_time_buffer_s: 0.10

    # NOTE: pseudo_emergency_stop emulates the MRM stop behaviors. This is for evaluation only.
    pseudo_emergency_stop:
      deceleration_mps2: -6.0  # [m/s^2] target longitudinal deceleration (negative)
      jerk_mps3: -20.0  # [m/s^3] longitudinal jerk to ramp the deceleration (negative)
      recovery_policy: "until_stopped"  # "until_stopped": keep decelerating until ego is stopped, "immediate": release as soon as the trigger disappears
      recovery_velocity_threshold_mps: 0.1  # [m/s] ego velocity threshold under which the latched emergency-stop state is released when recovery_policy is "until_stopped"
